<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Winnipeg 311 Search</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<header>
			<h1>City of Winnipeg 311 Service Request Search</h1>
			<p>Search recent 311 requests by keyword and optional date.</p>
		</header>

		<main>
			<section aria-labelledby="search-heading" class="panel">
				<h2 id="search-heading">Search Filters</h2>
				<form id="searchForm" novalidate>
					<div class="form-row">
						<label for="keyword">Keyword (subject)</label>
						<input
							type="text"
							id="keyword"
							name="keyword"
							required
							placeholder="Example: pothole"
						/>
					</div>

					<div class="form-row">
						<label for="requestDate">Open Date (optional)</label>
						<input type="date" id="requestDate" name="requestDate" />
					</div>

					<button type="submit" id="searchButton">Search</button>
				</form>
			</section>

			<section aria-labelledby="results-heading" class="panel">
				<h2 id="results-heading">Results</h2>
				<p id="statusMessage" aria-live="polite">Enter a keyword, then click Search.</p>
				<div class="table-wrapper">
					<table>
						<thead>
							<tr>
								<th scope="col">Subject</th>
								<th scope="col">Reason</th>
								<th scope="col">Open Date</th>
								<th scope="col">Status</th>
							</tr>
						</thead>
						<tbody id="resultsBody"></tbody>
					</table>
				</div>
			</section>
		</main>

		<script src="script.js"></script>
	</body>
</html>
